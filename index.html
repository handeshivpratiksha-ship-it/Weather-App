<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>🌤️ Weather App</h1>
        <p class="subtitle">Check the weather anywhere in the world</p>

        <!-- Search -->
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..."
            >

            <button id="searchBtn">Search</button>
        </div>
        <button id="locationBtn">📍 Use My Location</button>

        <!-- Error message -->
        <p id="errorMessage"></p>

        <!-- Current Weather -->
        <div class="weather-card">

            <h2 id="cityName">Search for a city</h2>

            <div class="weather-main">

                <div>
                    <span id="weatherIcon">🌤️</span>
                </div>

                <div>
                    <h3 id="temperature">--°C</h3>
                    <p id="weatherCondition">---</p>
                </div>

            </div>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </div>

        <!-- Forecast -->
        <h2 class="forecast-title">5-Day Forecast</h2>

        <div id="forecast" class="forecast-container">

            <div class="forecast-card">
                <p>---</p>
                <span>🌤️</span>
                <strong>--°C</strong>
            </div>

            <div class="forecast-card">
                <p>---</p>
                <span>🌤️</span>
                <strong>--°C</strong>
            </div>

            <div class="forecast-card">
                <p>---</p>
                <span>🌤️</span>
                <strong>--°C</strong>
            </div>

            <div class="forecast-card">
                <p>---</p>
                <span>🌤️</span>
                <strong>--°C</strong>
            </div>

            <div class="forecast-card">
                <p>---</p>
                <span>🌤️</span>
                <strong>--°C</strong>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
